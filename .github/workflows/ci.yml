name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Credenciais descartáveis, só destes containers do CI. Não são as do .env de ninguém.
    env:
      POSTGRES_USER: diagro
      POSTGRES_PASSWORD: diagro_ci
      POSTGRES_DB: diagro
      MONGO_INITDB_ROOT_USERNAME: diagro
      MONGO_INITDB_ROOT_PASSWORD: diagro_ci
      RUSTFS_ACCESS_KEY: diagro
      RUSTFS_SECRET_KEY: diagro_ci_123
      JWT_SECRET: segredo-do-ci-nao-usar-fora-daqui
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diagro
          POSTGRES_PASSWORD: diagro_ci
          POSTGRES_DB: diagro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diagro"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: diagro
          MONGO_INITDB_ROOT_PASSWORD: diagro_ci
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: diagro
          RUSTFS_SECRET_KEY: diagro_ci_123
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -v

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
